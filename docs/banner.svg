<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <title>Midnight — SillyTavern 現代深色皮套</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9c0ff"/>
      <stop offset="1" stop-color="#ff9ae3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="1" r="0.55">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d28"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
    <linearGradient id="userCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262245"/>
      <stop offset="1" stop-color="#1b1a30"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0c11" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#0b0c11" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <mask id="crescent">
      <circle cx="122" cy="116" r="52" fill="#fff"/>
      <circle cx="148" cy="98" r="44" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="400" rx="24" fill="#0b0c11"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>

  <!-- star field -->
  <g fill="#fff">
    <circle cx="420" cy="48" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="92" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="352" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="330" r="1" opacity="0.6"/>
    <circle cx="1220" cy="56" r="1.6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1" opacity="0.4"/>
    <circle cx="96" cy="356" r="1.2" opacity="0.5"/>
    <path d="M660 300 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5 -6.5 -6.5 -2.5 6.5 -2.5 z" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- logo mark -->
  <g transform="translate(58 40) scale(0.56)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="#161824" stroke="#fff" stroke-opacity="0.1" stroke-width="1.6"/>
    <path d="M68 70 a24 24 0 0 1 24 -24 h72 a24 24 0 0 1 24 24 v80 a24 24 0 0 1 -24 24 h-44 l-26 24 v-24 h-2 a24 24 0 0 1 -24 -24 z"
          fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round" opacity="0.9"/>
    <rect x="60" y="54" width="130" height="130" fill="url(#accent)" mask="url(#crescent)"/>
    <path d="M168 72 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif">
    <text x="64" y="282" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#accentText)">Midnight</text>
    <text x="68" y="324" font-size="24" font-weight="500" fill="#a3a8b8">SillyTavern 現代深色皮套 · Modern dark skin</text>

    <!-- feature pills -->
    <g font-size="15" font-weight="600" fill="#e7e9f0">
      <rect x="224" y="70" width="112" height="34" rx="17" fill="#8b7cff" fill-opacity="0.14" stroke="#8b7cff" stroke-opacity="0.45"/>
      <text x="280" y="92" text-anchor="middle">一鍵安裝</text>
      <rect x="224" y="114" width="112" height="34" rx="17" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
      <text x="280" y="136" text-anchor="middle">5 種主色</text>
      <rect x="346" y="70" width="132" height="34" rx="17" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
      <text x="412" y="92" text-anchor="middle">卡片 / 扁平</text>
      <rect x="346" y="114" width="132" height="34" rx="17" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
      <text x="412" y="136" text-anchor="middle">關掉即還原</text>
    </g>
  </g>

  <!-- mock UI -->
  <g transform="translate(760 40)" font-family="Inter, 'Segoe UI', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
    <!-- top bar -->
    <rect x="40" y="0" width="420" height="40" rx="14" fill="#12141b" stroke="#fff" stroke-opacity="0.07"/>
    <g fill="#6d7284">
      <rect x="88" y="14" width="12" height="12" rx="3"/>
      <rect x="140" y="14" width="12" height="12" rx="3"/>
      <rect x="192" y="10" width="20" height="20" rx="7" fill="#8b7cff" fill-opacity="0.22"/>
      <rect x="196" y="14" width="12" height="12" rx="3" fill="#a99dff"/>
      <rect x="244" y="14" width="12" height="12" rx="3"/>
      <rect x="296" y="14" width="12" height="12" rx="3"/>
      <rect x="348" y="14" width="12" height="12" rx="3"/>
      <rect x="400" y="14" width="12" height="12" rx="3"/>
    </g>

    <!-- bot message -->
    <g filter="url(#shadow)">
      <rect x="0" y="56" width="460" height="118" rx="18" fill="url(#card)" stroke="#fff" stroke-opacity="0.08"/>
    </g>
    <rect x="18" y="74" width="40" height="40" rx="12" fill="url(#accent)" opacity="0.85"/>
    <text x="72" y="92" font-size="15" font-weight="700" fill="#e7e9f0">Seraphina</text>
    <text x="160" y="92" font-size="12" fill="#6d7284">10:18 PM</text>
    <rect x="72" y="106" width="350" height="9" rx="4.5" fill="#e7e9f0" opacity="0.55"/>
    <rect x="72" y="125" width="300" height="9" rx="4.5" fill="#e7e9f0" opacity="0.4"/>
    <rect x="72" y="144" width="210" height="9" rx="4.5" fill="#c9c0ff" opacity="0.5"/>

    <!-- user message -->
    <g filter="url(#shadow)">
      <rect x="40" y="188" width="420" height="72" rx="18" fill="url(#userCard)" stroke="#8b7cff" stroke-opacity="0.3"/>
    </g>
    <text x="64" y="216" font-size="15" font-weight="700" fill="#c9c0ff">You</text>
    <rect x="64" y="230" width="280" height="9" rx="4.5" fill="#e7e9f0" opacity="0.5"/>

    <!-- composer -->
    <g filter="url(#shadow)">
      <rect x="0" y="276" width="460" height="52" rx="20" fill="#181b24" stroke="#8b7cff" stroke-opacity="0.45"/>
    </g>
    <rect x="-4" y="272" width="468" height="60" rx="24" fill="none" stroke="#8b7cff" stroke-opacity="0.14" stroke-width="4"/>
    <text x="24" y="307" font-size="14" fill="#6d7284">Type a message…</text>
    <rect x="148" y="292" width="2" height="20" fill="#c9c0ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="410" y="284" width="38" height="36" rx="13" fill="url(#accent)"/>
    <path d="M421 302 l16 -7 -6 16 -3 -6 z" fill="#fff"/>
  </g>

  <rect width="1280" height="400" rx="24" fill="none" stroke="#fff" stroke-opacity="0.08"/>
</svg>
