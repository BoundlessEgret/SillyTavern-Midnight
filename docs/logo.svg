<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Midnight</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d2a"/>
      <stop offset="1" stop-color="#0b0c11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- crescent = full disc minus an offset disc -->
    <mask id="crescent">
      <circle cx="122" cy="116" r="52" fill="#fff"/>
      <circle cx="148" cy="98" r="44" fill="#000"/>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="url(#rim)"/>
  <circle cx="128" cy="118" r="100" fill="url(#glow)"/>

  <!-- chat bubble outline -->
  <path d="M68 70 a24 24 0 0 1 24 -24 h72 a24 24 0 0 1 24 24 v80 a24 24 0 0 1 -24 24 h-44 l-26 24 v-24 h-2 a24 24 0 0 1 -24 -24 z"
        fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round" opacity="0.9"/>

  <!-- moon -->
  <rect x="60" y="54" width="130" height="130" fill="url(#accent)" mask="url(#crescent)"/>

  <!-- stars -->
  <g fill="#fff">
    <path d="M168 72 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="150" cy="140" r="3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="118" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
